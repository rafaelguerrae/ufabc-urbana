name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo runs these in every workspace that defines them.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      # Not a Turborepo task yet, so it runs in the web workspace directly.
      - name: Unit tests
        run: pnpm --filter ufabc-urbana-web test

      # The build needs no secrets or environment variables.
      - name: Build
        run: pnpm build

  data-pipeline:
    name: Data pipeline (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Only the dev group (ruff, at the version in uv.lock): the geospatial dependencies are not needed to lint.
      - run: uv sync --only-dev --frozen

      - name: Lint
        run: uv run --no-sync ruff check src
